<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interesting Questions ❤️</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <img src="IMG-20260730-WA0022.jpg" class="banner">

    <h2>Answer These Questions ❤️</h2>

    <form id="questionForm">

        <div class="question">
            <label>1. Hum kaha mile pehli Baar?</label>
            <input type="text" id="q1" readonly>
        </div>

        <div class="question">
            <label>2. My name in your contact list?</label>
            <input type="text" id="q2" readonly>
        </div>

        <div class="question">
            <label>3. Mujhe kya mante ho?</label>
            <input type="text" id="q3" readonly>
        </div>

        <div class="question">
            <label>4. Mujhme kya acha lagta hai?</label>
            <input type="text" id="q4" readonly>
        </div>

        <div class="question">
            <label>5. How many % you love me?</label>
            <input type="text" id="q5" readonly>
        </div>

        <div class="question">
            <label>6. Mujhme kya acha nahi lagta?</label>
            <input type="text" id="q6" readonly>
        </div>

        <div class="question">
            <label>7. Agar main tumse dur chala jau to kya karoge?</label>
            <input type="text" id="q7" readonly>
        </div>

        <div class="question">
            <label>8. Do you trust me?</label>
            <input type="text" id="q8" readonly>
        </div>

        <div class="question">
            <label>9. Give me one nickname?</label>
            <input type="text" id="q9" readonly>
        </div>

        <div class="question">
            <label>10. Can I share your answer in my status?</label>
            <input type="text" id="q10" readonly>
        </div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
